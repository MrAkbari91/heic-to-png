name: Build applications

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test on Python 3.12 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .[dev]
      - run: pytest

  build:
    name: Build ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            artifact: heic-to-png-windows
            asset_name: heic-to-png-windows.exe
            exe_name: HEIC-to-PNG.exe
          - os: macos-latest
            name: macOS
            artifact: heic-to-png-macos
            asset_name: heic-to-png-macos
            exe_name: HEIC-to-PNG
          - os: ubuntu-latest
            name: Linux
            artifact: heic-to-png-linux
            asset_name: heic-to-png-linux
            exe_name: HEIC-to-PNG
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .[build]
      - run: pyinstaller --noconfirm --clean HEIC-to-PNG.spec
      - name: Rename executable for release
        shell: bash
        run: |
          cd dist
          mv "${{ matrix.exe_name }}" "${{ matrix.asset_name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.asset_name }}

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true

